version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: genealogy_user
      POSTGRES_PASSWORD: genealogy_password
      POSTGRES_DB: genealogy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
